# prefix
# candidate: M-b, C-t
unbind C-b
set -g prefix C-t
bind C-t send-prefix

set -g mode-keys vi

# if in kitty, image can be rendered
set -g allow-passthrough on

# send focus event, so that vim/nvim autoread can work
set -g focus-events on

# ======== APPEARANCE ========

set -g status-left-length 20

# ======== Kitty Keyboard Protocol ========

# https://blog.fsck.com/agent-blog/2026/02/26/terminal-keyboard-protocol/#tmux
# Forward extended key sequences to applications
#set -s extended-keys on
# Tell tmux your outer terminal supports extended keys
# Adjust the glob to match your terminal's $TERM value
#set -as terminal-features 'xterm-kitty:extkeys'
# Use CSI u encoding format
#set -s extended-keys-format csi-u
